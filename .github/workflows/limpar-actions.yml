name: Limpar Actions antigas

on:
  workflow_dispatch:
    inputs:
      manter:
        description: "Quantos runs recentes manter (0 = apagar todos)"
        required: true
        default: "0"

permissions:
  actions: write
  contents: read

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar runs antigos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MANTER: ${{ github.event.inputs.manter }}
          RUN_ATUAL: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id)"' \
            | grep -v "^$RUN_ATUAL$" \
            | tail -n +$((MANTER + 1)) \
            | while read id; do
                echo "Apagando run $id"
                gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
              done
